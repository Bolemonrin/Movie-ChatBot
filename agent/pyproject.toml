[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["movie_chatbot"]

[project]
name = "movie-chatbot"
version = "0.1.0"
requires-python = ">=3.12"

# Everything identical on both machines lives here
dependencies = [
    "langchain",
    "langchain-community",
    "langchain-openai",
    "langchain-core",
    "langchain-ollama",
    "langgraph",
    "langsmith",
    "python-dotenv",
    "requests",
    "pydantic",
    "tqdm",
    "transformers",
    "huggingface-hub",
    "ipython",
    "openai",
    "langchain-google-genai>=4.2.7",
    "langchain-huggingface>=1.2.2",
    "sumy>=0.12.0",
    "nltk>=3.10.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

# The machine-specific part: torch comes in via one of two extras
# Console entry point, so the terminal chat is runnable from anywhere in the
# repo without naming a file path.
[project.scripts]
movie-chatbot = "movie_chatbot.cli:main"

[project.optional-dependencies]
cpu = [
    "torch",
    "torchvision",
]
cu130 = [
    "torch",
    "torchvision",
]

# Pin torch/torchvision to the right index depending on which extra is active
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]      # <-- adds the project root to sys.path
