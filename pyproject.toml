# Workspace root. Owns no code of its own — it exists to tie the members
# together under one uv.lock and one .venv, so `agent` and `api` can never
# drift onto different versions of langchain, pydantic or anything else.
[tool.uv.workspace]
members = ["agent", "api"]

[tool.uv]
# The two torch extras are mutually exclusive; declaring that lets the resolver
# lock both variants without them fighting. Qualified by package because the
# extras belong to the `movie-chatbot` member, not to the root.
conflicts = [
    [
        { package = "movie-chatbot", extra = "cpu" },
        { package = "movie-chatbot", extra = "cu130" },
    ],
]

# Indexes are resolved workspace-wide, so they have to live at the root.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
