[project]
name = "movie-chatbot-api"
version = "0.1.0"
description = "FastAPI transport layer over the movie-chatbot langgraph agent."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "movie-chatbot",
]

[project.scripts]
movie-chatbot-web = "movie_api.dev:web"

[dependency-groups]
dev = [
    "httpx",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["movie_api"]

[tool.uv.sources]
# Resolved from the workspace rather than PyPI, and installed editable — so
# edits under agent/movie_chatbot are live here with no reinstall.
movie-chatbot = { workspace = true }
